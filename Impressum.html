    <style>
        /* Grundlegende Styles aus der Hauptseite übernehmen */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: #1d1d1f;
            background-color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }
        
        header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            position: sticky;
            top: 0;
            z-index: 999;
            border-bottom: 1px solid #d2d2d7;
        }
        
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 22px;
        }
        
        .logo {
            height: 36px;
        }
        
        .privacy-policy-page {
            max-width: 800px;
            margin: 80px auto;
            padding: 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 36px;
            line-height: 1.1;
            font-weight: 600;
            letter-spacing: -0.002em;
            margin-bottom: 30px;
        }
        
        h2 {
            font-size: 24px;
            line-height: 1.2;
            font-weight: 600;
            margin: 40px 0 20px;
        }
        
        p, ul, ol {
            font-size: 17px;
            line-height: 1.47;
            letter-spacing: -0.022em;
            margin-bottom: 20px;
        }
        
        ul, ol {
            padding-left: 30px;
        }
        
        a {
            color: #0071e3;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 22px;
            background-color: #f5f5f7;
            color: #1d1d1f;
            border-radius: 980px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 500;
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .back-button:hover {
            background-color: #e8e8ed;
            text-decoration: none;
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
            font-size: 14px;
            color: #86868b;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Sprach-Umschalter Styles */
        .language-selector {
            position: relative;
            margin-left: auto;
        }

        .language-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
        }

        .language-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        .language-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1000;
            overflow: hidden;
        }

        .language-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .language-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #1d1d1f;
            text-decoration: none;
            transition: background-color 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .language-option:hover {
            background-color: #f5f5f7;
        }

        .language-option.active {
            background-color: rgba(102, 126, 234, 0.1);
            color: #667eea;
            font-weight: 600;
        }

        .flag-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="SmartGerman.html">
                <img src="/Users/denniskostjuk/Documents/Business/Logo/SmartGerman-bg-remove.png" alt="SmartGerman Logo" class="logo">
            </a>
            
            <div class="language-selector">
                <button id="languageBtn" class="language-toggle" onclick="toggleLanguageDropdown()" title="Sprache wechseln">
                    <span class="flag-icon">🇩🇪</span>
                    <span class="lang-text">DE</span>
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div id="languageDropdown" class="language-dropdown">
                    <a href="#" onclick="changeLanguage('de'); return false;" class="language-option active" data-lang="de">
                        <span class="flag-icon">🇩🇪</span>
                        <span>Deutsch</span>
                    </a>
                    <a href="#" onclick="changeLanguage('en'); return false;" class="language-option" data-lang="en">
                        <span class="flag-icon">🇬🇧</span>
                        <span>English</span>
                    </a>
                    <a href="#" onclick="changeLanguage('ru'); return false;" class="language-option" data-lang="ru">
                        <span class="flag-icon">🇷🇺</span>
                        <span>Русский</span>
                    </a>
                    <a href="#" onclick="changeLanguage('ua'); return false;" class="language-option" data-lang="ua">
                        <span class="flag-icon">🇺🇦</span>
                        <span>Українська</span>
                    </a>
                </div>
            </div>
        </div>
    </header>
    
    <div class="privacy-policy-page">
        <h1 data-i18n="imprint_title">Impressum</h1>
        
        <h2 data-i18n="imprint_info_title">Angaben gemäß § 5 TMG</h2>
        <p>
            <span data-i18n="privacy_company_name">SmartGerman Sprachschule</span><br>
            Hüttenstraße 24a<br>
            30165 Hannover<br>
            Deutschland
        </p>
        
        <h2 data-i18n="imprint_represented_title">Vertreten durch</h2>
        <p>
            <span data-i18n="owner_name">Anastasia Sitov</span>
        </p>
        
        <h2 data-i18n="imprint_contact_title">Kontakt</h2>
        <p>
            <span data-i18n="contact_phone">Telefon</span>: 0511 12345678<br>
            <span data-i18n="contact_email">E-Mail</span>: info@smart-german.de
        </p>
        
        <a href="SmartGerman.html" class="back-button" data-i18n="back_to_home">Zurück zur Homepage</a>
    </div>
    
    <footer>
    </footer>

    <script src="translations.js"></script>
    <script>
        // Funktion zum Umschalten des Dropdowns
        function toggleLanguageDropdown() {
            const dropdown = document.getElementById('languageDropdown');
            dropdown.classList.toggle('show');
        }

        // Event-Listener, um das Dropdown zu schließen, wenn man außerhalb klickt
        document.addEventListener('click', function(event) {
            const selector = document.querySelector('.language-selector');
            if (selector && !selector.contains(event.target)) {
                document.getElementById('languageDropdown')?.classList.remove('show');
            }
        });

        // Funktion zum Aktualisieren des Sprach-Buttons
        function updateLanguageButton() {
            const langBtn = document.getElementById('languageBtn');
            if (langBtn) {
                const flags = { 'de': '🇩🇪', 'en': '🇬🇧', 'ru': '🇷🇺', 'ua': '🇺🇦' };
                const codes = { 'de': 'DE', 'en': 'EN', 'ru': 'RU', 'ua': 'UA' };
                
                langBtn.querySelector('.flag-icon').textContent = flags[currentLanguage];
                langBtn.querySelector('.lang-text').textContent = codes[currentLanguage];
                
                document.querySelectorAll('.language-option').forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.lang === currentLanguage);
                });
            }
        }

        // Überschreibt die `changeLanguage` Funktion, um das Dropdown zu schließen
        const originalChangeLanguage = window.changeLanguage;
        window.changeLanguage = function(lang) {
            originalChangeLanguage(lang);
            toggleLanguageDropdown();
        };

        // Initiales Laden der Sprache
        document.addEventListener('DOMContentLoaded', function() {
            currentLanguage = localStorage.getItem('smartgerman_language') || 'de';
            updatePageLanguage();
            updateLanguageButton();
        });
    </script>
</body>
</html>
